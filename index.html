<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>专注时钟 & 倒计时 - 让工位静下来，让时间看得见</title>
  <meta name="description" content="专为工位办公、旧平板/iPad横屏桌面改造、学生沉浸自习打造的高颜值纯前端「专注时钟 & 倒计时」：3D机械翻牌、扫秒大表盘、晶莹流沙、火花炸弹与白噪音专注空间。">
  <meta name="theme-color" content="#09090b">
  <link rel="stylesheet" href="assets/css/flip.css?v=1.0.5">
</head>
<body>
  <!-- Fullscreen Exit Floating Hint -->
  <div class="fs-exit-hint" id="fs-exit-hint">按 F 或 ESC 退出全屏</div>

  <div class="app-container">
    <!-- Header Controls -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">⏳</span>
        <h1 class="brand-title" id="brand-title" data-i18n="brand_title">专注时钟 & 倒计时</h1>
        <span class="brand-tag">v1.0</span>
      </div>

      <div class="controls-group">
        <!-- Theme Selector Dots -->
        <div class="theme-selector" id="theme-selector" role="radiogroup" aria-label="主题配色">
          <button class="theme-dot active" data-theme-val="oled" title="OLED 纯黑" aria-label="OLED 纯黑"></button>
          <button class="theme-dot" data-theme-val="parchment" title="羊皮纸白" aria-label="羊皮纸白"></button>
          <button class="theme-dot" data-theme-val="amber" title="暖橘微光" aria-label="暖橘微光"></button>
        </div>

        <!-- Language Toggle -->
        <button id="btn-lang" class="btn-ctrl" title="中英切换 / Toggle Language">
          <span style="font-size: 0.85rem;">🌐</span>
          <span id="lang-label">EN</span>
        </button>

        <button id="btn-giant" class="btn-ctrl" title="巨幕演讲大字模式 / Giant Stage Mode">📺 巨幕</button>
        <button id="btn-12h" class="btn-ctrl" title="切换 12/24 小时制">24H</button>
        <button id="btn-seconds" class="btn-ctrl active" title="显示/隐藏秒钟">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span id="seconds-label">秒钟</span>
        </button>
        <button id="btn-fullscreen" class="btn-ctrl btn-icon" title="全屏模式 (快捷键 F)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Display Stage (4 Visual Forms: 📟 Flip / ⏱️ Dial / ⏳ Sand / 💣 Bomb) -->
    <main class="stage-main">
      <!-- Visual Representations Switcher Bar -->
      <nav class="visual-mode-bar" id="visual-mode-bar" role="tablist" aria-label="展示形态切换">
        <button class="visual-btn active" data-visual="flip" title="机械翻牌 (快捷键 V)">
          <span>📟</span> <span data-i18n="visual_flip">机械翻牌</span>
        </button>
        <button class="visual-btn" data-visual="pendulum" title="复古摆钟 (快捷键 V)">
          <span>🕰️</span> <span data-i18n="visual_pendulum">复古摆钟</span>
        </button>
        <button class="visual-btn" data-visual="dial" title="扫秒表盘 (快捷键 V)">
          <span>⏱️</span> <span data-i18n="visual_dial">扫秒表盘</span>
        </button>
        <button class="visual-btn" data-visual="sand" title="流沙漏斗 (快捷键 V)">
          <span>⏳</span> <span data-i18n="visual_sand">流沙漏斗</span>
        </button>
        <button class="visual-btn" data-visual="bomb" title="火花炸弹 (快捷键 V)">
          <span>💣</span> <span data-i18n="visual_bomb">火花炸弹</span>
        </button>
      </nav>

      <!-- 1. Visual Form: Split-Flap Clock -->
      <div class="visual-container active" id="visual-container-flip">
        <div class="clock-wrapper" id="clock-wrapper">
        <!-- Meridiem AM/PM Badge for 12H mode -->
        <div id="meridiem-badge" class="meridiem-badge">AM</div>

        <div class="clock-display">
          <!-- Hours Group -->
          <div class="digit-group group-hours">
            <div class="flip-card" id="card-h1">
              <div class="card-half card-top static-top"><span class="digit-char">0</span></div>
              <div class="card-half card-bottom static-bottom">
                <span class="digit-char">0</span>
                <div class="static-bottom-shadow"></div>
              </div>
              <div class="flip-leaf">
                <div class="leaf-front">
                  <span class="digit-char">0</span>
                  <div class="leaf-shadow"></div>
                </div>
                <div class="leaf-back">
                  <span class="digit-char">0</span>
                  <div class="leaf-shadow"></div>
                </div>
              </div>
              <div class="flip-card-seam"></div>
            </div>

            <div class="flip-card" id="card-h2">
              <div class="card-half card-top static-top"><span class="digit-char">0</span></div>
              <div class="card-half card-bottom static-bottom">
                <span class="digit-char">0</span>
                <div class="static-bottom-shadow"></div>
              </div>
              <div class="flip-leaf">
                <div class="leaf-front">
                  <span class="digit-char">0</span>
                  <div class="leaf-shadow"></div>
                </div>
                <div class="leaf-back">
                  <span class="digit-char">0</span>
                  <div class="leaf-shadow"></div>
                </div>
              </div>
              <div class="flip-card-seam"></div>
            </div>
          </div>

          <!-- Colon Separator 1 -->
          <div class="time-separator sep-hours pulsing">
            <span class="sep-dot"></span>
            <span class="sep-dot"></span>
          </div>

          <!-- Minutes Group -->
          <div class="digit-group group-minutes">
            <div class="flip-card" id="card-m1">
              <div class="card-half card-top static-top"><span class="digit-char">0</span></div>
              <div class="card-half card-bottom static-bottom">
                <span class="digit-char">0</span>
                <div class="static-bottom-shadow"></div>
              </div>
              <div class="flip-leaf">
                <div class="leaf-front">
                  <span class="digit-char">0</span>
                  <div class="leaf-shadow"></div>
                </div>
                <div class="leaf-back">
                  <span class="digit-char">0</span>
                  <div class="leaf-shadow"></div>
                </div>
              </div>
              <div class="flip-card-seam"></div>
            </div>

            <div class="flip-card" id="card-m2">
              <div class="card-half card-top static-top"><span class="digit-char">0</span></div>
              <div class="card-half card-bottom static-bottom">
                <span class="digit-char">0</span>
                <div class="static-bottom-shadow"></div>
              </div>
              <div class="flip-leaf">
                <div class="leaf-front">
                  <span class="digit-char">0</span>
                  <div class="leaf-shadow"></div>
                </div>
                <div class="leaf-back">
                  <span class="digit-char">0</span>
                  <div class="leaf-shadow"></div>
                </div>
              </div>
              <div class="flip-card-seam"></div>
            </div>
          </div>

          <!-- Colon Separator 2 -->
          <div class="time-separator sep-seconds pulsing">
            <span class="sep-dot"></span>
            <span class="sep-dot"></span>
          </div>

          <!-- Seconds Group -->
          <div class="digit-group group-seconds">
            <div class="flip-card" id="card-s1">
              <div class="card-half card-top static-top"><span class="digit-char">0</span></div>
              <div class="card-half card-bottom static-bottom">
                <span class="digit-char">0</span>
                <div class="static-bottom-shadow"></div>
              </div>
              <div class="flip-leaf">
                <div class="leaf-front">
                  <span class="digit-char">0</span>
                  <div class="leaf-shadow"></div>
                </div>
                <div class="leaf-back">
                  <span class="digit-char">0</span>
                  <div class="leaf-shadow"></div>
                </div>
              </div>
              <div class="flip-card-seam"></div>
            </div>

            <div class="flip-card" id="card-s2">
              <div class="card-half card-top static-top"><span class="digit-char">0</span></div>
              <div class="card-half card-bottom static-bottom">
                <span class="digit-char">0</span>
                <div class="static-bottom-shadow"></div>
              </div>
              <div class="flip-leaf">
                <div class="leaf-front">
                  <span class="digit-char">0</span>
                  <div class="leaf-shadow"></div>
                </div>
                <div class="leaf-back">
                  <span class="digit-char">0</span>
                  <div class="leaf-shadow"></div>
                </div>
              </div>
              <div class="flip-card-seam"></div>
            </div>
          </div>
        </div>
      </div>
      <!-- End of Visual Form: Split-Flap Clock -->
    </div>

    <!-- 2. Visual Form: Vintage Pendulum Clock (复古摆钟) -->
    <div class="visual-container" id="visual-container-pendulum">
      <div class="visual-pendulum-wrapper">
        <svg class="pendulum-clock-svg" id="pendulum-clock-svg" viewBox="0 0 260 420">
          <defs>
            <!-- Rich Mahogany / Walnut Case Gradient -->
            <linearGradient id="pendulum-case-grad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#1f140e" />
              <stop offset="20%" stop-color="#3b2014" />
              <stop offset="50%" stop-color="#4a2c1d" />
              <stop offset="80%" stop-color="#3b2014" />
              <stop offset="100%" stop-color="#1f140e" />
            </linearGradient>

            <!-- Polished Brass Bezel Gradient -->
            <linearGradient id="pendulum-brass-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#78531d" />
              <stop offset="25%" stop-color="#d4af37" />
              <stop offset="50%" stop-color="#fef08a" />
              <stop offset="75%" stop-color="#b45309" />
              <stop offset="100%" stop-color="#451a03" />
            </linearGradient>

            <!-- Dial Face Gradient -->
            <radialGradient id="pendulum-dial-grad" cx="50%" cy="45%" r="55%">
              <stop offset="0%" stop-color="#1c1917" />
              <stop offset="70%" stop-color="#141210" />
              <stop offset="100%" stop-color="#09090b" />
            </radialGradient>

            <!-- Heavy Brass Pendulum Bob Radial Highlight -->
            <radialGradient id="pendulum-bob-grad" cx="40%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#fef9c3" />
              <stop offset="30%" stop-color="#eab308" />
              <stop offset="70%" stop-color="#a16207" />
              <stop offset="100%" stop-color="#451a03" />
            </radialGradient>

            <!-- Glass Chamber Sheen -->
            <linearGradient id="pendulum-glass-sheen" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="rgba(255,255,255,0.18)" />
              <stop offset="40%" stop-color="rgba(255,255,255,0.03)" />
              <stop offset="100%" stop-color="rgba(255,255,255,0)" />
            </linearGradient>
          </defs>

          <!-- 1. Wooden Arch Cabinet Case -->
          <path class="pendulum-case-body" d="M 32,82 C 32,16 228,16 228,82 L 228,396 C 228,406 218,414 206,414 L 54,414 C 42,414 32,406 32,396 Z" fill="url(#pendulum-case-grad)" stroke="#78531d" stroke-width="2.5" />
          
          <!-- Top Architectural Pediment / Brass Finial -->
          <circle cx="130" cy="18" r="6.5" fill="url(#pendulum-brass-grad)" stroke="#451a03" stroke-width="1" />
          <path d="M 116,28 Q 130,22 144,28" stroke="url(#pendulum-brass-grad)" stroke-width="3" fill="none" stroke-linecap="round" />

          <!-- Bottom Moulding Trim Base -->
          <rect x="22" y="408" width="216" height="8" rx="4" fill="url(#pendulum-brass-grad)" stroke="#451a03" stroke-width="1" />

          <!-- 2. Lower Pendulum Exhibition Chamber (Darkened Recessed Chamber) -->
          <rect x="48" y="192" width="164" height="204" rx="12" fill="#09090b" stroke="url(#pendulum-brass-grad)" stroke-width="1.8" />
          <!-- Inner Shadow / Depth in Chamber -->
          <rect x="52" y="196" width="156" height="196" rx="9" fill="rgba(0,0,0,0.5)" />

          <!-- 3. Swinging Brass Pendulum (Pivot at 130, 115) -->
          <g transform="translate(130, 115)">
            <g id="pendulum-arm" class="pendulum-swing-group">
              <!-- Suspension Block -->
              <rect x="-5" y="69" width="10" height="7" rx="1.5" fill="url(#pendulum-brass-grad)" stroke="#451a03" stroke-width="0.8" />
              <!-- Solid Brass Pendulum Rod (Guaranteed visible in all SVG engines) -->
              <rect x="-2" y="72" width="4" height="150" rx="2" fill="url(#pendulum-brass-grad)" stroke="#78531d" stroke-width="0.6" />
              <!-- Heavy Mirror-Polished Brass Bob -->
              <circle class="pendulum-bob" cx="0" cy="221" r="26" fill="url(#pendulum-bob-grad)" stroke="#78531d" stroke-width="2" />
              <!-- Decorative Inner Bob Rings -->
              <circle cx="0" cy="221" r="17" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" />
              <circle cx="0" cy="221" r="6" fill="#78531d" />
              <!-- Bottom Rating Nut (调速螺母) -->
              <polygon points="-4,247 4,247 2,259 -2,259" fill="url(#pendulum-brass-grad)" stroke="#451a03" stroke-width="0.8" />
            </g>
          </g>

          <!-- Glass Chamber Specular Reflection Overlay -->
          <rect x="50" y="194" width="160" height="200" rx="10" fill="url(#pendulum-glass-sheen)" pointer-events="none" />

          <!-- 4. Upper Circular Dial Section -->
          <!-- Outer Brass Bezel -->
          <circle cx="130" cy="115" r="76" fill="url(#pendulum-brass-grad)" stroke="#451a03" stroke-width="1.5" />
          <!-- Inner Dial Face -->
          <circle class="pendulum-dial-face" cx="130" cy="115" r="71" fill="url(#pendulum-dial-grad)" stroke="#a16207" stroke-width="1" />
          <!-- Dial Inner Rim Bead -->
          <circle cx="130" cy="115" r="64" fill="none" stroke="rgba(212,175,55,0.4)" stroke-width="0.8" stroke-dasharray="2 4" />

          <!-- Roman Numerals & Classic Hour Indices -->
          <text class="pendulum-numeral" x="130" y="65" text-anchor="middle">XII</text>
          <text class="pendulum-numeral" x="183" y="119" text-anchor="middle">III</text>
          <text class="pendulum-numeral" x="130" y="171" text-anchor="middle">VI</text>
          <text class="pendulum-numeral" x="77" y="119" text-anchor="middle">IX</text>

          <!-- 12-Hour Dot Markers -->
          <circle cx="157" cy="69" r="2.2" class="pendulum-dot" />
          <circle cx="178" cy="89" r="2.2" class="pendulum-dot" />
          <circle cx="178" cy="142" r="2.2" class="pendulum-dot" />
          <circle cx="157" cy="162" r="2.2" class="pendulum-dot" />
          <circle cx="103" cy="162" r="2.2" class="pendulum-dot" />
          <circle cx="82" cy="142" r="2.2" class="pendulum-dot" />
          <circle cx="82" cy="89" r="2.2" class="pendulum-dot" />
          <circle cx="103" cy="69" r="2.2" class="pendulum-dot" />

          <!-- 5. Center Pivot Assembly & Clock Hands (Pivot at 130, 115) -->
          <g transform="translate(130, 115)">
            <!-- Hour Hand (Breguet spade hand) -->
            <g id="pendulum-hour-hand" class="pendulum-hand hour-hand">
              <line x1="0" y1="0" x2="0" y2="-40" stroke="#fef08a" stroke-width="3.6" stroke-linecap="round" />
              <circle cx="0" cy="-31" r="4.2" fill="#fef08a" stroke="#78350f" stroke-width="0.8" />
              <line x1="0" y1="0" x2="0" y2="12" stroke="#fef08a" stroke-width="2.2" />
            </g>

            <!-- Minute Hand (Long pointer hand) -->
            <g id="pendulum-minute-hand" class="pendulum-hand minute-hand">
              <line x1="0" y1="0" x2="0" y2="-58" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
              <circle cx="0" cy="-48" r="3.2" fill="#fef08a" stroke="#78350f" stroke-width="0.6" />
              <line x1="0" y1="0" x2="0" y2="14" stroke="#fef08a" stroke-width="1.8" />
            </g>

            <!-- Second Hand (Slender red needle with counterpoise) -->
            <g id="pendulum-second-hand" class="pendulum-hand second-hand">
              <line x1="0" y1="0" x2="0" y2="-65" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
              <circle cx="0" cy="0" r="3" fill="#ef4444" />
              <line x1="0" y1="0" x2="0" y2="18" stroke="#ef4444" stroke-width="1.8" />
              <circle cx="0" cy="18" r="2.5" fill="#ef4444" />
            </g>

            <!-- Center Brass Pivot Cap -->
            <circle cx="0" cy="0" r="4.5" fill="url(#pendulum-brass-grad)" stroke="#451a03" stroke-width="0.8" />
          </g>
        </svg>

        <!-- Digital Readout Below Clock Base -->
        <div class="pendulum-readout-pill">
          <span class="pendulum-readout-time" id="pendulum-readout">12:00:00</span>
        </div>
      </div>
    </div>

    <!-- 3. Visual Form: Classic Dial Stopwatch (扫秒表盘) -->
    <div class="visual-container" id="visual-container-dial">
      <div class="visual-dial-wrapper">
        <div class="dial-crown" id="dial-crown" title="表冠"></div>
        <div class="dial-case">
          <div class="dial-face">
            <!-- 60-Second Graduation Ticks -->
            <svg class="dial-ticks-svg" id="dial-ticks-svg" viewBox="0 0 300 300">
              <!-- Dial ring and numerals will be rendered crisp & clear -->
              <circle cx="150" cy="150" r="136" fill="none" stroke="currentColor" stroke-opacity="0.08" stroke-width="1.5" />
              <!-- Numerals 60, 15, 30, 45 -->
              <text x="150" y="32" class="dial-numeral">60</text>
              <text x="272" y="154" class="dial-numeral">15</text>
              <text x="150" y="276" class="dial-numeral">30</text>
              <text x="28" y="154" class="dial-numeral">45</text>
              <!-- 12 Major Hour/5-Min tick lines -->
              <line x1="150" y1="18" x2="150" y2="38" class="dial-tick-major" />
              <line x1="216" y1="36" x2="206" y2="53" class="dial-tick-major" />
              <line x1="264" y1="84" x2="247" y2="94" class="dial-tick-major" />
              <line x1="282" y1="150" x2="262" y2="150" class="dial-tick-major" />
              <line x1="264" y1="216" x2="247" y2="206" class="dial-tick-major" />
              <line x1="216" y1="264" x2="206" y2="247" class="dial-tick-major" />
              <line x1="150" y1="282" x2="150" y2="262" class="dial-tick-major" />
              <line x1="84" y1="264" x2="94" y2="247" class="dial-tick-major" />
              <line x1="36" y1="216" x2="53" y2="206" class="dial-tick-major" />
              <line x1="18" y1="150" x2="38" y2="150" class="dial-tick-major" />
              <line x1="36" y1="84" x2="53" y2="94" class="dial-tick-major" />
              <line x1="84" y1="36" x2="94" y2="53" class="dial-tick-major" />
            </svg>
            <!-- Sweeping Mechanical Needle -->
            <div class="dial-needle" id="dial-needle"></div>
            <!-- Center Hub -->
            <div class="dial-hub"></div>
            <!-- Digital Readout Sub-Display -->
            <div class="dial-readout" id="dial-readout">00:00:00</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Visual Form: Glass Hourglass (晶莹流沙漏斗) -->
    <div class="visual-container" id="visual-container-sand">
      <div class="visual-sand-wrapper">
        <svg class="hourglass-svg" id="hourglass-svg" viewBox="0 0 240 370">
          <defs>
            <!-- Rich Amber-Gold Sand Gradient -->
            <linearGradient id="sand-gold-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fef08a" />
              <stop offset="25%" stop-color="#f59e0b" />
              <stop offset="70%" stop-color="#d97706" />
              <stop offset="100%" stop-color="#92400e" />
            </linearGradient>

            <!-- Glass Reflection Gradient -->
            <linearGradient id="glass-reflection-grad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(255,255,255,0.45)" />
              <stop offset="50%" stop-color="rgba(255,255,255,0.06)" />
              <stop offset="100%" stop-color="rgba(255,255,255,0)" />
            </linearGradient>

            <!-- Pillar Metallic Gradient -->
            <linearGradient id="pillar-metal-grad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#52525b" />
              <stop offset="35%" stop-color="#a1a1aa" />
              <stop offset="70%" stop-color="#71717a" />
              <stop offset="100%" stop-color="#27272a" />
            </linearGradient>

            <!-- Stand Base Gradient -->
            <linearGradient id="stand-base-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3f3f46" />
              <stop offset="50%" stop-color="#27272a" />
              <stop offset="100%" stop-color="#18181b" />
            </linearGradient>

            <!-- Glass Interior Clip Path -->
            <clipPath id="hourglass-interior-clip">
              <path d="M 45,28 C 45,85 78,140 114,175 L 114,185 C 78,220 45,275 45,332 L 195,332 C 195,275 162,220 126,185 L 126,175 C 162,140 195,85 195,28 Z" />
            </clipPath>
          </defs>

          <!-- 1. Support Pillars (Slender Structural Rods) -->
          <rect x="22" y="24" width="7" height="312" rx="3.5" fill="url(#pillar-metal-grad)" />
          <circle cx="25.5" cy="24" r="5" fill="#a1a1aa" opacity="0.85" />
          <circle cx="25.5" cy="336" r="5" fill="#a1a1aa" opacity="0.85" />

          <rect x="211" y="24" width="7" height="312" rx="3.5" fill="url(#pillar-metal-grad)" />
          <circle cx="214.5" cy="24" r="5" fill="#a1a1aa" opacity="0.85" />
          <circle cx="214.5" cy="336" r="5" fill="#a1a1aa" opacity="0.85" />

          <!-- 2. Architectural Top & Bottom Plates -->
          <rect x="14" y="14" width="212" height="15" rx="7.5" fill="url(#stand-base-grad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" />
          <rect x="26" y="24" width="188" height="5" rx="2" fill="rgba(255,255,255,0.06)" />

          <rect x="14" y="331" width="212" height="15" rx="7.5" fill="url(#stand-base-grad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" />
          <rect x="26" y="331" width="188" height="5" rx="2" fill="rgba(0,0,0,0.5)" />

          <!-- 3. Glass Tint & Ambient Shadow -->
          <path d="M 45,28 C 45,85 78,140 114,175 L 114,185 C 78,220 45,275 45,332 L 195,332 C 195,275 162,220 126,185 L 126,175 C 162,140 195,85 195,28 Z" fill="rgba(255, 255, 255, 0.03)" />

          <!-- 4. Dynamic Flowing Sand (Clipped inside Glass Interior) -->
          <g clip-path="url(#hourglass-interior-clip)">
            <!-- Top Sand Body -->
            <path id="sand-top-path" fill="url(#sand-gold-grad)" d="M 45,30 C 45,85 78,140 114,175 L 126,175 C 162,140 195,85 195,30 Z" />

            <!-- Flowing Sand Stream -->
            <line id="sand-trickle" class="hg-trickle-line" x1="120" y1="172" x2="120" y2="330" stroke="url(#sand-gold-grad)" stroke-width="3" stroke-linecap="round" />

            <!-- Bottom Sand Heap Mound -->
            <path id="sand-bottom-path" fill="url(#sand-gold-grad)" d="M 70,332 Q 120,315 170,332 Z" />
          </g>

          <!-- 5. Glass Reflections & Specular Highlights -->
          <!-- Left Specular Reflection -->
          <path class="hg-specular-left" d="M 52,38 C 52,85 82,140 112,172 L 112,188 C 82,220 52,275 52,322" fill="none" stroke="url(#glass-reflection-grad)" stroke-width="3" stroke-linecap="round" />
          <!-- Right Specular Rim Light -->
          <path class="hg-specular-right" d="M 188,38 C 188,85 158,140 128,172 L 128,188 C 158,220 188,275 188,322" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.8" stroke-linecap="round" />

          <!-- Outer Borosilicate Glass Contour Rim -->
          <path class="hg-glass-rim" d="M 45,28 C 45,85 78,140 114,175 L 114,185 C 78,220 45,275 45,332 L 195,332 C 195,275 162,220 126,185 L 126,175 C 162,140 195,85 195,28 Z" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2.5" />
        </svg>

        <!-- Floating Time Readout Pill (Elegantly Placed Below Base) -->
        <div class="hourglass-readout-pill">
          <span class="hourglass-readout-time" id="sand-readout">25:00</span>
        </div>
      </div>
    </div>

    <!-- 4. Visual Form: Spark Fuse Bomb (火花炸弹) -->
    <div class="visual-container" id="visual-container-bomb">
      <div class="visual-bomb-wrapper">
        <div class="bomb-fuse-box" id="bomb-fuse-box">
          <svg class="bomb-fuse-svg" id="bomb-fuse-svg" viewBox="0 0 220 110">
            <!-- 1. Charred Black Ash Residue Path (Burned Core) -->
            <path id="bomb-fuse-ash" class="bomb-fuse-ash"
              d="M 22,28 C 45,5 95,8 118,32 C 140,54 185,15 204,42 C 218,65 185,92 142,76 C 105,62 108,92 110,110" />

            <!-- 2. Unburnt Braided Rope Path (Burns Away from Tip to Bomb) -->
            <path id="bomb-fuse-burn" class="bomb-fuse-burn"
              d="M 22,28 C 45,5 95,8 118,32 C 140,54 185,15 204,42 C 218,65 185,92 142,76 C 105,62 108,92 110,110" />
          </svg>
          <!-- Dynamic Burning Spark with Glowing Halos -->
          <div class="bomb-spark" id="bomb-spark"></div>
        </div>
        <div class="bomb-body">
          <div class="bomb-cap"></div>
          <div class="bomb-led-screen">
            <div class="bomb-led-digits" id="bomb-readout">25:00</div>
          </div>
        </div>
        <!-- Explosion Blast Overlay -->
        <div class="bomb-boom-overlay" id="bomb-boom-overlay">💥 BOOM!</div>
      </div>
    </div>

      <!-- Hairline Progress Bar -->
      <div class="time-progress-bar" id="time-progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <!-- Traffic Light Pacing Indicator (Stage & Keynote) -->
      <div class="pacing-badge" id="pacing-badge">
        <span class="pacing-dot"></span>
        <span id="pacing-text">控时良好</span>
      </div>

      <!-- Date & Weekday Ribbon -->
      <div class="date-ribbon">
        <div id="date-text" class="date-text">2026年11月25日 星期三</div>
        <div id="date-sub" class="date-sub">专注此时此刻 · 让工位静下来</div>
      </div>

      <!-- Mode Selector (3 Main Categories: 实时时钟 / 专注秒钟 / 倒计时) -->
      <nav class="modes-bar" aria-label="核心模式切换">
        <button class="mode-btn active" data-mode="clock" id="mode-clock">
          <span>🕒</span> <span data-i18n="mode_clock">实时时钟</span>
        </button>
        <button class="mode-btn" data-mode="stopwatch" id="mode-stopwatch">
          <span>⏱️</span> <span data-i18n="mode_stopwatch">专注秒钟</span>
        </button>
        <button class="mode-btn" data-mode="countdown" id="mode-countdown">
          <span>⏳</span> <span data-i18n="mode_countdown">倒计时</span>
        </button>
      </nav>

      <!-- Timer Action Bar (for Stopwatch & Countdown) -->
      <div class="timer-action-bar" id="timer-action-bar" style="display: none;">
        <!-- Primary Action Button -->
        <button id="btn-timer-toggle" class="btn-timer-primary">
          <span id="timer-toggle-icon">▶</span>
          <span id="timer-toggle-label">开始计时</span>
        </button>

        <!-- Reset Button -->
        <button id="btn-timer-reset" class="btn-timer-secondary" title="重置 (R)">
          <span>🔄</span>
          <span id="timer-reset-label">重置</span>
        </button>

        <!-- Lap Button (Only in Stopwatch) -->
        <button id="btn-timer-lap" class="btn-timer-secondary" style="display: none;" title="记录计次 (L)">
          <span>🏁</span>
          <span id="timer-lap-label">计次</span>
        </button>

        <!-- Pacing Indicator Toggle (Stopwatch) -->
        <button id="btn-pacing-toggle" class="btn-timer-secondary" style="display: none;" title="开关控时红绿灯">
          <span>🚦</span>
          <span id="pacing-toggle-label">控时灯</span>
        </button>

        <!-- Countdown Presets & Custom Trigger -->
        <div class="pomo-presets" id="countdown-presets" style="display: none;">
          <button class="btn-timer-pill" data-minutes="5">5m</button>
          <button class="btn-timer-pill" data-minutes="10">10m</button>
          <button class="btn-timer-pill" data-minutes="15">15m</button>
          <button class="btn-timer-pill active" data-minutes="25">25m</button>
          <button class="btn-timer-pill" data-minutes="45">45m</button>
          <button class="btn-timer-pill" data-minutes="60">60m</button>
          <button class="btn-timer-pill btn-custom-trigger" id="btn-custom-trigger" title="自定义时分秒">
            <span>⚙️</span> <span data-i18n="custom_time_btn">自定义</span>
          </button>
        </div>
      </div>

      <!-- Custom Countdown Time Picker Panel -->
      <div class="custom-time-panel" id="custom-time-panel" style="display: none;">
        <div class="custom-time-header">
          <span class="custom-time-title" data-i18n="custom_time_title">设定自定义倒计时</span>
          <button class="btn-close-panel" id="btn-close-custom" title="关闭面板">✕</button>
        </div>
        <div class="custom-time-inputs">
          <div class="time-input-group">
            <label data-i18n="time_hours">时</label>
            <input type="number" id="input-custom-hours" min="0" max="99" value="0" />
          </div>
          <span class="custom-time-sep">:</span>
          <div class="time-input-group">
            <label data-i18n="time_minutes">分</label>
            <input type="number" id="input-custom-minutes" min="0" max="59" value="25" />
          </div>
          <span class="custom-time-sep">:</span>
          <div class="time-input-group">
            <label data-i18n="time_seconds">秒</label>
            <input type="number" id="input-custom-seconds" min="0" max="59" value="0" />
          </div>
        </div>
        <div class="custom-time-quick-chips">
          <button class="quick-chip" data-add-sec="60">+1分</button>
          <button class="quick-chip" data-add-sec="300">+5分</button>
          <button class="quick-chip" data-add-sec="600">+10分</button>
          <button class="quick-chip" data-add-sec="1800">+30分</button>
          <button class="quick-chip chip-clear" id="btn-quick-clear">清零</button>
        </div>
        <div class="custom-time-actions">
          <button class="btn-apply-custom" id="btn-apply-custom" data-i18n="custom_apply">确认并载入</button>
        </div>
      </div>

      <!-- Stopwatch Lap Records -->
      <div class="lap-container" id="lap-container" style="display: none;">
        <div class="lap-header">
          <span data-i18n="lap_title">🏁 计次记录 (Laps)</span>
          <button id="btn-clear-laps" class="btn-clear-laps" data-i18n="lap_clear">清空</button>
        </div>
        <div class="lap-list" id="lap-list"></div>
      </div>

      <!-- Clock Ticking Sound Selector (Pure Clock Simulation) & Screen Wake Lock -->
      <div class="clock-sound-bar" id="clock-sound-bar" aria-label="秒针模拟音">
        <span class="sound-bar-label" data-i18n="sound_label">秒针音:</span>
        <button class="sound-pill active" data-tick="mute" title="静音">
          <span>🔇</span> <span data-i18n="tick_mute">静音</span>
        </button>
        <button class="sound-pill" data-tick="mechanical" title="经典机械发条擒纵齿轮音">
          <span>⚙️</span> <span data-i18n="tick_mechanical">机械发条</span>
        </button>
        <button class="sound-pill" data-tick="quartz" title="现代高精度石英指针步进音">
          <span>⚡</span> <span data-i18n="tick_quartz">石英脉冲</span>
        </button>
        <button class="sound-pill" data-tick="pendulum" title="沉稳复古落地大摆钟">
          <span>🪵</span> <span data-i18n="tick_pendulum">复古摆钟</span>
        </button>
        <button class="sound-pill" data-tick="chrono" title="金属精密秒表双跳击响">
          <span>⏱️</span> <span data-i18n="tick_chrono">精密秒表</span>
        </button>
        <button id="btn-wakelock" class="wakelock-pill active" title="点击开关防息屏 (Keep Screen On)">
          <span class="wakelock-icon">🔒</span>
          <span id="wakelock-label">防息屏</span>
        </button>
      </div>
    </main>

    <!-- Footer Status & Tips -->
    <footer class="app-footer">
      <div class="footer-tip">
        <span id="footer-tip-text">💡 双击任意处或按 <span class="kbd-badge">F</span> 键进入极简全屏</span>
      </div>
      <div class="footer-links">
        <span class="footer-link">time.ucncn.cn</span>
        <span class="footer-link" id="footer-slogan" style="opacity: 0.6;">沉浸专注空间</span>
      </div>
    </footer>
  </div>

  <script src="assets/js/audio.js?v=1.0.5"></script>
  <script src="assets/js/app.js?v=1.0.5"></script>
</body>
</html>
